name: C17 build and tests

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DLKS_BUILD_BENCHMARKS=ON -DLKS_BUILD_RESEARCH=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 4
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Basic example
        run: .\build\Debug\layerkeysort_example.exe
      - name: Ordered-tree example
        run: .\build\Debug\layerkeysort_ordered_example.exe
      - name: Layer-list example
        run: .\build\Debug\layerkeysort_layer_list_example.exe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Distribution consumers and reproducible amalgamation
        run: python tools/validate_distribution.py

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [OFF, ON]
        exclude:
          - compiler: gcc
            sanitizer: ON
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLKS_ENABLE_SANITIZERS=${{ matrix.sanitizer }} -DLKS_BUILD_BENCHMARKS=ON -DLKS_BUILD_RESEARCH=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Basic example
        run: ./build/layerkeysort_example
      - name: Ordered-tree example
        run: ./build/layerkeysort_ordered_example
      - name: Layer-list example
        run: ./build/layerkeysort_layer_list_example
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Distribution consumers and reproducible amalgamation
        run: python3 tools/validate_distribution.py
      - name: Verify release asset wrapper
        if: matrix.compiler == 'gcc' && matrix.sanitizer == 'OFF'
        run: python3 tools/validate_release_assets.py

  macos-appleclang:
    runs-on: macos-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: clang --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLKS_BUILD_BENCHMARKS=ON -DLKS_BUILD_RESEARCH=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Basic example
        run: ./build/layerkeysort_example
      - name: Ordered-tree example
        run: ./build/layerkeysort_ordered_example
      - name: Layer-list example
        run: ./build/layerkeysort_layer_list_example
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Distribution consumers and reproducible amalgamation
        run: python3 tools/validate_distribution.py
