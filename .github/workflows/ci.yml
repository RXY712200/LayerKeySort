name: C17 build and tests

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.architecture }} -DLKS_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Basic example
        run: .\build\Debug\layerkeysort_example.exe
      - name: Ordered-tree example
        run: .\build\Debug\layerkeysort_ordered_example.exe
      - name: Layer-list example
        run: .\build\Debug\layerkeysort_layer_list_example.exe
      - name: V4 explicit-order example
        run: .\build\Debug\layerkeysort_order_example.exe
      - name: V4 managed-order example
        run: .\build\Debug\layerkeysort_managed_order_example.exe
      - name: V4 snapshot/persistence example
        run: .\build\Debug\layerkeysort_snapshot_example.exe
      - name: V4 immutable Group snapshot example
        run: .\build\Debug\layerkeysort_group_snapshot_example.exe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen V4 public API manifest
        run: python tools/verify_v4_api.py
      - name: Distribution consumers and reproducible amalgamation
        run: python tools/validate_distribution.py --architecture ${{ matrix.architecture }}

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [OFF, ON]
        exclude:
          - compiler: gcc
            sanitizer: ON
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLKS_ENABLE_SANITIZERS=${{ matrix.sanitizer }} -DLKS_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Basic example
        run: ./build/layerkeysort_example
      - name: Ordered-tree example
        run: ./build/layerkeysort_ordered_example
      - name: Layer-list example
        run: ./build/layerkeysort_layer_list_example
      - name: V4 explicit-order example
        run: ./build/layerkeysort_order_example
      - name: V4 managed-order example
        run: ./build/layerkeysort_managed_order_example
      - name: V4 snapshot/persistence example
        run: ./build/layerkeysort_snapshot_example
      - name: V4 immutable Group snapshot example
        run: ./build/layerkeysort_group_snapshot_example
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen V4 public API manifest
        run: python tools/verify_v4_api.py
      - name: Distribution consumers and reproducible amalgamation
        run: python3 tools/validate_distribution.py
      - name: RC extended sanitizer campaign
        if: matrix.compiler == 'clang' && matrix.sanitizer == 'ON'
        run: |
          ./build/layerkeysort_v4_mutation --long
          ./build/layerkeysort_v4_rc_torture --long
          ./build/layerkeysort_v4_trace distant_drag 100001 100000 0 7 1
          ./build/layerkeysort_v4_trace long_churn 4096 200000 0 17 1
      - name: Verify release asset wrapper
        if: matrix.compiler == 'gcc' && matrix.sanitizer == 'OFF'
        run: python3 tools/validate_release_assets.py

  macos-appleclang:
    runs-on: macos-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: clang --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLKS_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Basic example
        run: ./build/layerkeysort_example
      - name: Ordered-tree example
        run: ./build/layerkeysort_ordered_example
      - name: Layer-list example
        run: ./build/layerkeysort_layer_list_example
      - name: V4 explicit-order example
        run: ./build/layerkeysort_order_example
      - name: V4 managed-order example
        run: ./build/layerkeysort_managed_order_example
      - name: V4 snapshot/persistence example
        run: ./build/layerkeysort_snapshot_example
      - name: V4 immutable Group snapshot example
        run: ./build/layerkeysort_group_snapshot_example
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen V4 public API manifest
        run: python tools/verify_v4_api.py
      - name: Distribution consumers and reproducible amalgamation
        run: python3 tools/validate_distribution.py
