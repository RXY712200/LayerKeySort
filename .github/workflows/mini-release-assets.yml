name: Build Mini source candidate assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mini-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify Mini-only source assets
        run: |
          python3 tools/mini_release_assets.py --output-dir mini-release-assets
          python3 tools/mini_release_assets.py --output-dir mini-release-assets --verify
          python3 tools/mini_release_assets.py --output-dir mini-release-repeat
          diff -qr mini-release-assets mini-release-repeat
      - name: Verify extracted Mini independently
        shell: bash
        run: |
          mkdir -p mini-release-unpacked
          archives=(mini-release-assets/*-source.zip)
          test "${#archives[@]}" -eq 1
          unzip -q "${archives[0]}" -d mini-release-unpacked
          mini_dir="$(find mini-release-unpacked -mindepth 1 -maxdepth 1 -type d -name 'LayerKeySort-Mini-v*' -print -quit)"
          test -n "$mini_dir"
          test ! -e "$mini_dir/include/layerkeysort.h"
          cmake -S "$mini_dir" -B mini-release-build -DCMAKE_BUILD_TYPE=Release -DLKS_MINI_STRICT=ON
          cmake --build mini-release-build
          ctest --test-dir mini-release-build --output-on-failure
      - name: Record source provenance
        run: |
          echo "Mini-only source candidate, NOT a GitHub Release" >> "$GITHUB_STEP_SUMMARY"
          printf 'Source commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/mini_release_assets.py --output-dir mini-release-assets --verify >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review-only candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: LayerKeySort-Mini-source-candidate
          path: mini-release-assets/*
          if-no-files-found: error
          retention-days: 7
